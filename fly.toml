# fly.toml file generated for dm-miniflux on 2022-05-17T14:37:31-04:00

app = "dm-miniflux"
primary_region = "sjc"

kill_signal = "SIGTERM"
kill_timeout = 5

[build]
  [build.args]
    GO_VERSION = '1.27'

[env]
  PORT = "8080"
  BASE_URL = "https://miniflux.marquard.org/"
  DATABASE_MAX_CONNS = 10 # supabase has a max of 15 on the free plan
  RUN_MIGRATIONS = "1"
  POLLING_FREQUENCY = "5"
  POLLING_PARSING_ERROR_LIMIT = "60"
  SCHEDULER_ROUND_ROBIN_MIN_INTERVAL = "5"
  WEBAUTHN = true

[http_service]
  internal_port = 8080
  force_https = true
  # The background feed poller needs a machine running at all times.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"
    method = "GET"
    path = "/healthcheck"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
